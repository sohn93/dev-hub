<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="개인 게임 개발 프로젝트의 기획과 기술 문서를 모아 보는 허브" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Heosi 개발 허브</title>
    <link rel="icon" href="assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <div class="site-heading">
          <h1 id="site-title">Heosi 개발 허브</h1>
          <p id="site-sub">프로젝트별 기획과 기술 문서를 한곳에서 관리합니다.</p>
          <time id="site-updated" datetime="2026-10-13"></time>
        </div>

        <div class="hub-controls">
          <div class="project-filters" id="project-filters" aria-label="프로젝트 필터"></div>
          <input
            class="search-box"
            id="document-search"
            type="search"
            placeholder="문서 검색 — 제목 · 설명 · 태그 · 섹션"
            autocomplete="off"
            aria-label="문서 검색"
          />
        </div>
      </div>
    </header>

    <nav class="section-nav" aria-label="문서 카테고리">
      <div class="wrap section-nav-inner" id="section-nav"></div>
    </nav>

    <main class="wrap hub-main" id="main">
      <div class="hub-summary" id="work">
        <span id="result-count" aria-live="polite" aria-atomic="true">0개 문서</span>
      </div>
      <div id="library">
        <div id="document-sections"></div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <strong>일치하는 문서가 없습니다.</strong>
        <p>검색어를 줄이거나 프로젝트 필터를 바꿔보세요.</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span>Heosi 개발 허브</span>
      </div>
    </footer>

    <script src="data.js?v=20261013"></script>
    <script src="app.js?v=20261013"></script>
  </body>
</html>
